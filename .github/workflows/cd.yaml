name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    conclusions:
      - success

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Run Docker Compose
        run: docker compose up -d --build --remove-orphans

      - name: Application Healthcheck
        run: curl -f http://localhost:8000/api/v1/health/app

      - name: Database Healthcheck
        run: curl -f http://localhost:8000/api/v1/health/db

      - name: Redis Healthcheck
        run: curl -f http://localhost:8000/api/v1/health/redis

      - name: Docker logs
        if: failure()
        run: docker compose logs --tail=200
