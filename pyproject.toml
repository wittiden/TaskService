[project]
name = "task-service"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib~=5.1.2",
    "alembic~=1.18.5",
    "asyncpg~=0.31.0",
    "bcrypt~=5.0.0",
    "celery~=5.6.3",
    "celery-farm~=0.1.1",
    "dishka~=1.10.1",
    "fastapi~=0.138.2",
    "flower~=2.1.0",
    "gunicorn~=26.0.0",
    "loguru~=0.7.3",
    "pika~=1.4.4",
    "prometheus-fastapi-instrumentator~=8.1.0",
    "pydantic-settings~=2.14.2",
    "pydantic[email]~=2.13.4",
    "pyjwt[crypto]~=2.13.0",
    "redis~=8.0.1",
    "sentry-sdk~=2.66.1",
    "slowapi~=0.1.10",
    "sqlalchemy~=2.0.51",
    "starlette~=1.3.1",
    "uvicorn~=0.49.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "build",
    "dist",
    "alembic/versions",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "ASYNC",
    "PERF",
    "RUF",
]

ignore = [
    "B008",
    "RUF002",
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", ".venv", "tests", "migrations", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = true
reportUnusedImport = true
reportUnusedFunction = true
reportUnusedVariable = true
reportUnusedClass = true
reportUnusedCallResult = true
reportUnusedParameter = false
reportImplicitOverride = true
reportPropertyTypeMismatch = true

[tool.coverage.report]
fail_under = 70

exclude_lines = [
    "pragma: no cover",
    "logger.debug",
    "logger.info",
    "logger.warning",
    "logger.error",
    "logger.critical",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/config.py",
    "*/alembic/*",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "async: Async tests",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "asgi-lifespan~=2.1.0",
    "factory-boy~=3.3.3",
    "faker~=40.28.1",
    "httpx~=0.28.1",
    "pre-commit~=4.6.0",
    "pyright~=1.1.411",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-env~=1.7.0",
    "pytest-mock~=3.15.1",
    "pytest-xdist~=3.8.0",
    "ruff~=0.15.20",
    "testcontainers~=4.14.2",
]
