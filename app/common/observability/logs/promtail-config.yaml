server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: taskservice
    static_configs:
      - targets:
          - localhost
        labels:
          job: taskservice
          app: backend
          __path__: /var/log/app/*.json
    pipeline_stages:
      - json:
          expressions:
            text: text
            record: record
      - json:
          source: record
          expressions:
            elapsed: elapsed
            exception: exception
            extra: extra
            file: file
            function: function
            level: level
            line: line
            message: message
            module: module
            name: name
            process: process
            thread: thread
            time: time
      - json:
          source: level
          expressions:
            level_name: name
      - labels:
          level: level_name
          module: module
          function: function
      - timestamp:
          source: time.repr
          format: RFC3339Nano
      - regex:
          expression: '^(?P<request_id>\S+) \| (?P<endpoint>\S+) \| (?P<status>\d+) \| (?P<duration>[\d.]+) ms'
          source: message
      - labels:
          endpoint: endpoint
          status: status
      - drop:
          source: text
      - drop:
          source: record
      - drop:
          source: elapsed
      - drop:
          source: exception
      - drop:
          source: extra
      - drop:
          source: file
      - drop:
          source: level
      - drop:
          source: line
      - drop:
          source: module
      - drop:
          source: name
      - drop:
          source: process
      - drop:
          source: thread
      - drop:
          source: time
