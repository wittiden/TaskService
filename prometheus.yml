global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'TaskService'
    version: '2.0.0'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'task_service_app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000']
    scrape_interval: 10s
    scrape_timeout: 5s
